# stunt_mission_node parameters (docs/plans/roadster_demo_plan.md 5.6-5.8).
stunt_mission_node:
  ros__parameters:
    mode: drop
    # rigid body, from the expanded roadster URDF (rigid_body() in
    # tools/avkit/roadster_actuation_test.py prints these): total mass, COM in
    # the chassis frame, inertia about the COM
    mass: 1700.01                # the published target curb weight (1,800 before, 2026-11-03)
    com_chassis: [0.0079, 0.0, 0.0]
    inertia_diag: [566.8, 2950.6, 3386.7]   # with the suspension links, at 1,700 kg
    chassis_offset_z: 0.33       # chassis frame above base_link (wheel radius)
    landed_com_height: 0.33      # COM height when standing on the ground

    hold_time: 1.0               # fan hold before release [s]
    # flip: 0.5 turn takes the inverted car (top of the ramp) to upright
    flip_axis: [1.0, 0.0, 0.0]   # body roll = "kick flip"
    flip_turns: 0.5
    flip_delay: 0.4              # fall clear of the ceiling first (~1 m) [s]
    flip_duration: 0.65          # [s]: a quick kick flip, as Tesla's; the minimum-jerk peak (43 rad/s^2,
                                 # 26 kN.m) is 88% of one bottom pair's roll torque (0.8 s before)
    flip_level_duration: 0.4     # [s] then level the pitch the roll kept (the ceiling's 10 deg tilt),
                                 # on its own: blended into the roll it needs body yaw torque
    att_kp: [36.0, 36.0, 36.0]   # 6 rad/s natural frequency
    att_kd: [10.8, 10.8, 10.8]   # zeta 0.9

    brake_accel: 35.3            # a violent 3.6 g constant-deceleration profile after a long free fall,
                                 # as Tesla's landing burn: 4.6 m g of the 5.04 m g usable bottom thrust,
                                 # 0.44 m g left to correct with (2.5 g on 4 x 1.1 m g nozzles before;
                                 # 1.5 g before that), in one stage (no separate flare) ...
    flare_height: 0.0            # (no flare stage: flare_accel only covers the lead-time window)
    flare_accel: 35.3
    touchdown_speed: 0.75        # ... to this speed at touchdown_height, then a steady descent at it,
                                 # the car settling onto its wheels after the hard stop [m/s]
    touchdown_height: 0.30       # COM above standing [m]: the steady settle, ~0.4 s, a visible
                                 # hover after the hard stop (0.12 m, 0.3 s, before: barely seen;
                                 # an owner decision, 2026-11-03). It hovers on ~1 m g, ~50 kg/s
                                 # of gas, so the tank grew 0.6 -> 0.66 m^3 to pay for it (at
                                 # 0.6 m^3, 0.45 s of settle took the tank out of regulation,
                                 # land_imu1, and 0.38 s to 98% feed, land_imu3).
                                 # At least 0.08: the hanging wheels touch at ~0.02, and the IMU-only
                                 # height drifts +-3 cm over a 2.7 s flight (a profile still falling
                                 # through the error band touched down at 1.1 m/s, final_hop_imu4)
    thrust_fall_time: 0.02       # nozzle valve fall lag (xacro tau_fall_s): the burn ends this early
    brake_kv: 10.0               # [1/s]: profile errors grow at a / v_ref, so a 3.6 g stage needs the
                                 # stiff gain; at 3 the car ran 0.7 m/s under the profile, stopped
                                 # early, fell and touched at 0.79 m/s (land_imu2)
    flare_kv: 10.0               # [1/s]
    flare_lead_time: 0.04        # start the flare thrust this early: the nozzles take ~40 ms to rise
    lateral_kv: 2.0              # [1/s] flight: world-y force demand = -m kv vy (brakes the flip's drift)
    landed_load: 0.1             # touchdown: wheel contact > this x m g while upright (F/T)
    landed_height: -0.02         # backup: COM this far below standing height (suspension compressed) [m]
    odom_topic: /odom_truth      # state source: /odom_truth (Gazebo) or /odom_est (IMU EKF)
    use_odom_twist: false        # speed from the odometry twist (set for /odom_est)
    mission_timeout: 40.0        # a ramp run takes ~12 s before the hold
    start_delay: 0.0             # sim seconds after the first pose before starting

    # ground phase, ramp mode (geometry from world_json = maps/<world>.json)
    climb_speed: 6.0             # constant speed round the arc [m/s]
    accel: 2.0                   # run-in acceleration [m/s^2]
    stop_decel: 3.0              # braking to the hold point [m/s^2], measured along the track:
                                 # from 6 m/s it starts ~6 m before it
    hold_arc_deg: 150.0          # stop on the upper arc, 30 deg short of upside down (angle from the
                                 # arc's bottom): the tyres then get ~2.6 m of arc plus the ceiling to
                                 # reach speed. The park brake there needs 0.81 of the 0.96 m g of grip
                                 # traction control allows (0.63 m g normal load)
    hold_kx: 1.0                 # [1/s] position loop round the stop trajectory (the hold stands still)
    hold_inverted_time: 1.0      # standing still upside down at the top [s] (plan Phase 4 used 2)
    stop_tolerance: 0.15         # stopped within this of the hold point counts as stopped [m]
    park_brake: 3000.0           # wheel damping while standing [N.m per rad/s]
    release_after_hold: true     # false: stay held (Phase 4 test), true: drive off, flip, land
    # drive-off: from the hold on the arc, accelerate forward on the tyres alone
    # (still on the fan) over the rest of the arc and up the tilted ceiling, and
    # fly off its end, as Tesla's car did. The speed trajectory (drive_off_speed
    # over the run) asks for more than the tyres can give, so they run at the
    # traction-control limit and the car lets go at what they reach (~6 m/s).
    drive_off_speed: 8.0         # [m/s] trajectory target (above what the tyres reach)
    drive_off_rear_thrust: false # true: the four rear nozzles add what the tyres cannot
    drive_off_accel: 2.5         # [m/s^2] with rear thrust: the tyres' share; thrust adds the rest
    drive_off_flip_delay: 0.25   # fall clear of the ceiling (0.3 m in 0.25 s; the slow start of the
                                 # roll needs ~0.6 m by 0.45 s) before rolling [s]
    release_margin: 0.5          # let go with the front axle this far short of the edge [m]
    wheelbase: 2.7               # must match roadster.urdf.xacro
    speed_kp: 2.0                # [1/s], drive force = m (kp e + ki int e) + gravity ff
    speed_ki: 0.5
    traction_k: 0.8              # wheel torque cap = k mu N r per wheel (traction control)
    tire_mu: 1.2                 # must match roadster.urdf.xacro tire_mu
    wheel_radius: 0.33
    steer_k_lat: 0.3             # [rad/m] lateral offset across the ramp
    steer_k_head: 1.0            # [rad/rad] heading error
    steer_max: 0.3               # [rad]
    steer_enable: false          # straight track, no disturbance: hold the wheels straight
    fan_spinup_distance: 6.0     # start the fans this far before the ramp (~1 s) [m]

    ready_time: 2.0              # launch / hop: stand on the line first, parking brake on, so the
                                 # estimator calibrates its accelerometer bias at standstill [s]
    # launch mode (Demo C, roadster_launch): tyres at their traction limit plus a
    # constant rear throttle to 60 mph; fitted to the reported 0-60 in 0.81 s
    launch_throttle: 0.585       # of the four rear nozzles' 4.5 m g
    launch_speed: 26.8224        # 60 mph [m/s]: rear thrust off
    launch_brake_decel: 8.0      # then brake to a stop on the tyres [m/s^2]

    # hop mode (Demo B, roadster_hop): plan from the world's obstacle row
    # (hop_planner.hpp), approach on the wheels, lift burn, ballistic arc, landing
    hop_speed: 15.0              # approach and flight speed [m/s]
    hop_accel: 4.0               # approach acceleration on the tyres [m/s^2]
    hop_burn_accel: 24.5         # lift burn net upward acceleration (3.5 m g of the ~5 m g) [m/s^2]:
                                 # a harder, shorter burn loses less to gravity; with the flip
                                 # 1.5 g planned 59.2 kN.s, over the 57.3 allowed (hop_sweep)
    hop_clearance: 1.15          # planned, over every vehicle [m]: the plan target is 1.0 (minimum
                                 # 0.5), and the flown flip hop came in 0.13 m under its plan (the
                                 # real roll lifts a little less than the ideal one-pair model)
    hop_half_length: 2.3         # COM to the bumpers [m]
    hop_bottom_below_com: 0.40   # the hanging wheels' bottom under the COM in flight [m]
    hop_flip_turns: 1.0          # 360 deg roll over the row (0 = a level hop)
    hop_flip_duration: 1.6       # [s]: peak 0.64 m g on one bottom pair, ~33 kg of gas; plan
                                 # 56.1 kN.s, flip ends 0.44 s before the landing burn
    hop_roll_lever: 0.75         # bottom nozzles' y offset (nozzles.yaml) [m]
    hop_half_width: 0.93         # rolled-car clearance: the wheels' outer faces ... [m]
    hop_roof_above_com: 0.93     # ... and the cabin roof above the COM [m]
    exhaust_velocity: 350.0      # must match the xacro nozzle_defaults [m/s]
    tank_regulation_mass: 68.0   # air left when the tank drops out of regulation (measured) [kg]
    impulse_reserve_frac: 0.9    # reject a hop plan needing more than this of the usable impulse

    alloc_lambda: 1.0e-4         # valve-opening penalty (saves gas)
    # [Fx(world) Fy(world) Fz(world) Tx Ty Tz(body)] priorities. Flight: torque first,
    # then the lateral demand (side nozzles cancel the bottom pair's sideways push),
    # little else (no roof nozzles: rolling on one bottom pair cannot be force-free);
    # brake: world lift + torque, then the lateral demand.
    alloc_weights_flight: [0.01, 0.3, 0.01, 1.0, 1.0, 1.0]
    alloc_weights_brake: [0.05, 0.5, 1.0, 1.0, 1.0, 1.0]
