# stunt_mission_node parameters (docs/plans/roadster_demo_plan.md 5.6-5.8).
stunt_mission_node:
  ros__parameters:
    mode: drop
    # rigid body, from the expanded roadster URDF (rigid_body() in
    # tools/avkit/roadster_actuation_test.py prints these): total mass, COM in
    # the chassis frame, inertia about the COM
    mass: 1800.01
    com_chassis: [0.0075, 0.0, 0.0]
    inertia_diag: [597.9, 3123.4, 3582.4]   # with the suspension links (2026-10-16)
    chassis_offset_z: 0.33       # chassis frame above base_link (wheel radius)
    landed_com_height: 0.33      # COM height when standing on the ground

    hold_time: 1.0               # fan hold before release [s]
    # flip: 0.5 turn takes the inverted car (top of the ramp) to upright
    flip_axis: [1.0, 0.0, 0.0]   # body roll = "kick flip"
    flip_turns: 0.5
    flip_delay: 0.4              # fall clear of the ceiling first (~1 m) [s]
    flip_duration: 0.8           # [s]
    att_kp: [36.0, 36.0, 36.0]   # 6 rad/s natural frequency
    att_kd: [10.8, 10.8, 10.8]   # zeta 0.9

    brake_accel: 14.7            # 1.5 g constant-deceleration profile ...
    flare_height: 1.0            # ... down to this COM height above standing [m], then
    flare_accel: 19.6            # a 2 g flare (3 m g of the ~4 m g lift: 1 m g left to correct with) ...
    touchdown_speed: 1.0         # ... to this at touchdown_height [m/s]; the decaying thrust takes
                                 # off ~0.4 more: lands at ~0.6 (0.5 here landed at 0.4 but used 8 kg
                                 # more gas and left the tank out of regulation at touchdown)
    touchdown_height: 0.05       # COM above standing [m]: the hanging wheels touch at ~0.02
    thrust_fall_time: 0.02       # nozzle valve fall lag (xacro tau_fall_s): the flare ends this early
    brake_kv: 3.0
    flare_kv: 10.0               # [1/s] stiffer in the flare, where errors grow fast
    flare_lead_time: 0.04        # start the flare thrust this early: the nozzles take ~40 ms to rise
    lateral_kv: 2.0              # [1/s] flight: world-y force demand = -m kv vy (brakes the flip's drift)
    landed_load: 0.1             # touchdown: wheel contact > this x m g while upright (F/T)
    landed_height: -0.02         # backup: COM this far below standing height (suspension compressed) [m]
    odom_topic: /odom_truth      # state source: /odom_truth (Gazebo) or /odom_est (IMU EKF)
    use_odom_twist: false        # speed from the odometry twist (set for /odom_est)
    mission_timeout: 40.0        # a ramp run takes ~12 s before the hold
    start_delay: 0.0             # sim seconds after the first pose before starting

    # ground phase, ramp mode (geometry from world_json = maps/<world>.json)
    climb_speed: 6.0             # constant speed round the arc [m/s]
    accel: 2.0                   # run-in acceleration [m/s^2]
    stop_decel: 3.0              # braking to the hold point [m/s^2], measured along the track:
                                 # from 6 m/s it starts ~6 m before hold_x, on the upper arc
    hold_x: -1.5                 # stop just past the top: both axles on the 5 m overhang
    hold_kx: 1.0                 # [1/s] position loop round the stop trajectory (the hold stands still)
    hold_inverted_time: 1.0      # standing still upside down at the top [s] (plan Phase 4 used 2)
    stop_tolerance: 0.15         # stopped within this of hold_x counts as stopped [m]
    park_brake: 3000.0           # wheel damping while standing [N.m per rad/s]
    release_after_hold: true     # false: stay held (Phase 4 test), true: drive off, flip, land
    # drive-off: from the stationary inverted hold, accelerate forward (still on
    # the fan) and fly off the overhang's end with this speed. The short overhang
    # leaves ~1.7 m of run-up, so the rear nozzles add what the tyres cannot.
    drive_off_speed: 7.0         # [m/s]; 8 left too little gas in regulation for the landing
    drive_off_accel: 2.5         # [m/s^2] the tyres are counted on for; thrust adds the rest
    drive_off_flip_delay: 0.6    # fall + travel clear of the overhang edge before rolling [s]
    release_margin: 0.5          # let go with the front axle this far short of the edge [m]
    wheelbase: 2.7               # must match roadster.urdf.xacro
    speed_kp: 2.0                # [1/s], drive force = m (kp e + ki int e) + gravity ff
    speed_ki: 0.5
    traction_k: 0.8              # wheel torque cap = k mu N r per wheel (traction control)
    tire_mu: 1.2                 # must match roadster.urdf.xacro tire_mu
    wheel_radius: 0.33
    steer_k_lat: 0.3             # [rad/m] lateral offset across the ramp
    steer_k_head: 1.0            # [rad/rad] heading error
    steer_max: 0.3               # [rad]
    steer_enable: false          # straight track, no disturbance: hold the wheels straight
    fan_spinup_distance: 6.0     # start the fans this far before the ramp (~1 s) [m]

    alloc_lambda: 1.0e-4         # valve-opening penalty (saves gas)
    # [Fx(world) Fy(world) Fz(world) Tx Ty Tz(body)] priorities. Flight: torque first,
    # then the lateral demand (side nozzles cancel the bottom pair's sideways push),
    # little else (no roof nozzles: rolling on one bottom pair cannot be force-free);
    # brake: world lift + torque, then the lateral demand.
    alloc_weights_flight: [0.01, 0.3, 0.01, 1.0, 1.0, 1.0]
    alloc_weights_brake: [0.05, 0.5, 1.0, 1.0, 1.0, 1.0]
