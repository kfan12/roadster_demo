# Cold-gas nozzle layout for the roadster (10 nozzles, count as reported at the
# 2026-10-15 unveil; the layout itself is an ASSUMPTION - Tesla published none).
#
# Single source of truth: roadster.urdf.xacro loads this file (xacro.load_yaml)
# to place one TF frame per nozzle, and the thruster plugin (Phase 2, see
# docs/plans/roadster_demo_plan.md 5.3) will read the same file, so the frames
# RViz shows are the points the force is applied at.
#
# Frame: the `chassis` link (x forward, y left, z up; origin = floor-pan center
# = the chassis COM, 0.33 m above ground at rest).
#   xyz         nozzle exit position [m]
#   force_dir   unit direction of the force ON THE CAR (opposite the exhaust)
#   f_max_mg    max thrust at the reference feed pressure, as a multiple of the
#               model's total weight m*g, so the layout scales with mass
#               (rear pair 2 x 2.25 = 4.5 m g ~ "over 80 kN" at 1,800 kg).
nozzles:
  rear_main_left:   {xyz: [-2.25,  0.25, 0.30], force_dir: [1, 0, 0],  f_max_mg: 2.25}
  rear_main_right:  {xyz: [-2.25, -0.25, 0.30], force_dir: [1, 0, 0],  f_max_mg: 2.25}
  down_front_left:  {xyz: [ 1.90,  0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_front_right: {xyz: [ 1.90, -0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_rear_left:   {xyz: [-1.90,  0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_rear_right:  {xyz: [-1.90, -0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  side_front_left:  {xyz: [ 1.90,  0.90, 0.35], force_dir: [0, -1, 0], f_max_mg: 0.45}
  side_front_right: {xyz: [ 1.90, -0.90, 0.35], force_dir: [0, 1, 0],  f_max_mg: 0.45}
  side_rear_left:   {xyz: [-1.90,  0.90, 0.35], force_dir: [0, -1, 0], f_max_mg: 0.45}
  side_rear_right:  {xyz: [-1.90, -0.90, 0.35], force_dir: [0, 1, 0],  f_max_mg: 0.45}
