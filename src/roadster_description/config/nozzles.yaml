# Cold-gas nozzle layout for the roadster (10 nozzles, count as reported at the
# 2026-10-15 unveil; the layout itself is an ASSUMPTION - Tesla published none
# beyond "rear-mounted" (Thrust trim) and "around the perimeter, for upward and
# rotational movement" (Rocket trim)).
#
# Single source of truth: roadster.urdf.xacro loads this file (xacro.load_yaml)
# to place one TF frame per nozzle, and both the actuation system and the
# stunt mission node's allocator read the same file, so the frames RViz shows
# are the points the force is applied at.
#
# Frame: the `chassis` link (x forward, y left, z up; origin = floor-pan center
# = the chassis COM, 0.33 m above ground at rest).
#   xyz         nozzle exit position [m]
#   force_dir   unit direction of the force ON THE CAR (opposite the exhaust)
#   f_max_mg    max thrust at the reference feed pressure, as a multiple of the
#               model's total weight m*g, so the layout scales with mass
#               (rear four 4 x 1.125 = 4.5 m g ~ "over 80 kN" at 1,800 kg).
#
# Thruster groups (four rear, four bottom, two side: the grouping as the project
# owner described the car, 2026-10-17, not checked against a public source;
# positions and sizes are ours):
#   rear_main_*  four facing backward: the launch off the overhang. The prefix
#                is how the mission finds them for the drive-off thrust assist.
#   down_*       four bottom corners pushing up (body +z): lift, landing burn,
#                and the kick flip's roll torque (one side's pair).
#   side_*       one exhausting to each side, at the COM (x = 0, z = 0) so it
#                gives a pure lateral force with no roll or yaw torque.
# With no roof nozzles there is no force-free roll couple: rolling on one
# side's bottom pair also pushes the car along body z, which sweeps through the
# horizontal mid-flip and drifts it sideways (4.5 m in the 2026-10-16 drop test
# with in-plane side nozzles and no lateral control). The side nozzles cancel
# that drift: near the start and end of the flip, where the roll torque (and
# so the bottom thrust) peaks, body y is close to horizontal; after the flip
# they brake the remaining lateral speed before touchdown.
nozzles:
  rear_main_left_outer:  {xyz: [-2.25,  0.55, 0.30], force_dir: [1, 0, 0],  f_max_mg: 1.125}
  rear_main_left_inner:  {xyz: [-2.25,  0.20, 0.30], force_dir: [1, 0, 0],  f_max_mg: 1.125}
  rear_main_right_inner: {xyz: [-2.25, -0.20, 0.30], force_dir: [1, 0, 0],  f_max_mg: 1.125}
  rear_main_right_outer: {xyz: [-2.25, -0.55, 0.30], force_dir: [1, 0, 0],  f_max_mg: 1.125}
  down_front_left:  {xyz: [ 1.90,  0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_front_right: {xyz: [ 1.90, -0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_rear_left:   {xyz: [-1.90,  0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  down_rear_right:  {xyz: [-1.90, -0.75, 0.00], force_dir: [0, 0, 1],  f_max_mg: 1.10}
  side_left:        {xyz: [ 0.00,  0.90, 0.00], force_dir: [0, -1, 0], f_max_mg: 0.50}
  side_right:       {xyz: [ 0.00, -0.90, 0.00], force_dir: [0, 1, 0],  f_max_mg: 0.50}
